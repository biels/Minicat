# Optional local PostgreSQL. Schema setup is described in docs/database/README.md.
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: minicat
      POSTGRES_USER: minicat_dev
      POSTGRES_PASSWORD: ${MINICAT_DEV_DB_PASSWORD:?Set MINICAT_DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minicat_postgres:/var/lib/postgresql
volumes:
  minicat_postgres:
