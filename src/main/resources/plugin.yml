name: lobby
main: com.biel.lobby.lobby
description: Main plugin for the minicat (1.0) server.
depend:
- BielAPI
- DecentHolograms
- Triton
loadBefore:
- AuthMe
version: 1.4-dev
api-version: '26.2'
libraries:
- commons-io:commons-io:2.21.0
- commons-lang:commons-lang:2.6
- org.postgresql:postgresql:42.7.13
commands:
  info:
    description: Open the game guide.
    usage: /info [game]
    aliases: [i, guia]
  prova:
    description: Crea, llista o elimina instàncies de diagnòstic operatiu; importa plantilles antigues.
    usage: /prova <joc> [variant] | /prova llista | /prova elimina <món> | /prova importa
  mapes:
    description: List maps.
    usage: /mapes
  o:
    description: Show general options.
    usage: /o
  m:
    description: Choose a game.
    usage: /m
  minicatjoin:
    description: Join a game instance.
    usage: /minicatjoin <world>
  minicatstart:
    description: Start your game when its rules allow it.
    usage: /minicatstart
  lang:
    description: Choose your Minicat language.
    usage: /lang [code]
    aliases: [language, llengua, idioma]
  minicatai:
    description: Activa o desactiva el mode IA (instantànies de RainbowClay per als jugadors IA). Desactivat a cada arrencada; només operadors o consola.
    usage: /minicatai on|off
  a:
    description: Browse active games.
    usage: /a
  l:
    description: Return to the lobby.
    usage: /l
  p:
    description: Estableix la propietat.
    usage: /p
  e:
    description: Entra en mode edicio.
    usage: /e
  s:
    description: Guarda el mapa.
    usage: /s
  r:
    description: (Des)Activa el mode ranked.
    usage: /s
  elo:
    description: Show your Elo rating.
    usage: /elo
  top:
    description: Show player rankings.
    usage: /top
  ranking:
    description: Show player rankings.
    usage: /ranking
  prog:
    description: Show estimated game progress.
    usage: /prog
