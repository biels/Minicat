name: lobby
main: com.biel.lobby.lobby
description: Main plugin for the minicat (1.0) server.
depend:
- BielAPI
- DecentHolograms
loadBefore:
- AuthMe
version: 1.4-dev
api-version: '26.2'
libraries:
- commons-io:commons-io:2.21.0
- commons-lang:commons-lang:2.6
- com.mysql:mysql-connector-j:9.6.0
commands:
  guia:
    description: Obre la guia del joc on ets, o d'un joc pel nom.
    usage: /guia [joc]
  prova:
    description: Crea, llista o elimina instàncies de diagnòstic operatiu; importa plantilles antigues.
    usage: /prova <joc> [variant] | /prova llista | /prova elimina <món> | /prova importa
  mapes:
    description: Mostra una llista dels mapes.
    usage: /mapes
  o:
    description: Mostra les opcions generals.
    usage: /o
  m:
    description: Mostra l'inventari del teletransportador.
    usage: /m
  minicatjoin:
    description: Entra en una instància registrada des d'una invitació.
    usage: /minicatjoin <món>
  minicatstart:
    description: Inicia la instància on és el jugador, respectant les regles del joc.
    usage: /minicatstart
  minicatai:
    description: Activa o desactiva el mode IA (instantànies de RainbowClay per als jugadors IA). Desactivat a cada arrencada; només operadors o consola.
    usage: /minicatai on|off
  a:
    description: Mostra totes les partides en curs.
    usage: /a
  l:
    description: Retorna el jugador al lobby.
    usage: /l
  p:
    description: Estableix la propietat.
    usage: /p
  e:
    description: Entra en mode edicio.
    usage: /e
  s:
    description: Guarda el mapa.
    usage: /s
  r:
    description: (Des)Activa el mode ranked.
    usage: /s
  elo:
    description: Mostra l'elo actual.
    usage: /elo
  top:
    description: Mostra el top de jugadors.
    usage: /top
  ranking:
    description: Mostra el top de jugadors.
    usage: /ranking
  prog:
    description: Progres estimat de la partida (ETA).
    usage: /prog
