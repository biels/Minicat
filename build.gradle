plugins {
    id 'java'
}

version = '1.0-SNAPSHOT'

base {
    archivesName = 'minicat'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://jitpack.io')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def defaultEncoding = 'UTF-8'
compileJava{
    options.encoding = defaultEncoding
}
compileTestJava{
    options.encoding = defaultEncoding
}
dependencies {
    compileOnly 'com.google.guava:guava:33.6.0-jre'
    compileOnly 'commons-io:commons-io:2.21.0'
    compileOnly 'commons-lang:commons-lang:2.6'
    compileOnly 'org.postgresql:postgresql:42.7.13'
    compileOnly 'BielAPI:BielAPI:0.0.10-SNAPSHOT'
    compileOnly fileTree(dir: 'lib', include: '*.jar', exclude: [
            'BielAPI-*.jar',
            'NametagEdit*.jar',
            'spigot-*.jar'
    ])
    compileOnly 'io.papermc.paper:paper-api:26.2.build.92-stable'
    compileOnly('com.github.decentsoftware-eu.decentholograms:plugin:2.10.1') {
        transitive = false
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}
configurations.testImplementation.extendsFrom(configurations.compileOnly)

tasks.named('test') {
    useJUnitPlatform()
    // Server-free fixtures install global Bukkit registries; isolate each suite.
    forkEvery = 1
}

tasks.register('calibrateObsidianLaunchers', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.biel.lobby.mapes.jocs.ObsidianLauncherCalibration'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    doFirst { args project.property('launcherSurvey'), project.property('launcherReport') }
}

tasks.register('postgresTest', Test) {
    description = 'Run storage integration checks against disposable PostgreSQL.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*PostgresqlIntegrationTest' }
    doFirst {
        if (!System.getenv('MINICAT_TEST_DATABASE_CONFIG')) {
            throw new GradleException('MINICAT_TEST_DATABASE_CONFIG is required; database must be minicat_test')
        }
    }
}
